[project]
name = "pixs"
version = "0.1.0"
description = "Socle Pixs : noyau de composition générique et modules (P0 initial)"
requires-python = ">=3.12"
dependencies = [
    "Django==6.1.2",
    "psycopg[binary]==3.3.6",
    "asgiref==3.12.1",
    "sqlparse==0.6.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
]

[build-system]
requires = [
    "setuptools",
    # Dernières versions stables vérifiées au début de chaque campagne,
    # puis figées pendant toute sa durée.
    "Cython==3.3.0",
    "Nuitka==4.3.1",
]
build-backend = "setuptools.build_meta"
